spring.application.name=adult
# DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/adult}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:replace-this-with-a-32-plus-character-random-string-never-commit-it}
jwt.expiration=86400000

# Personal data (phone, date of birth, address) is encrypted with this key.
# Set DATA_ENCRYPTION_KEY in production; blank falls back to the JWT secret.
app.encryption.key=${DATA_ENCRYPTION_KEY:}

# Performance & low-bandwidth: gzip JSON/text responses over 1 KB
server.compression.enabled=true
server.compression.mime-types=application/json,text/csv,text/plain,text/html,application/javascript,text/css
server.compression.min-response-size=1024

# Concurrency: pool of database connections shared by simultaneous users
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
server.tomcat.threads.max=200

# Batch inserts/updates (attendance registers, enrollment)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HTTPS: in production, point these at a real certificate (or terminate TLS
# at a reverse proxy) so passwords and tokens are encrypted in transit.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# Content mirror (/api/media/file): lesson files under this CDN prefix are
# kept in media.cache-dir and served to devices without internet.
media.cdn-prefix=${MEDIA_CDN_PREFIX:https://vuleceqwhdmzdiugsety.supabase.co/storage/v1/object/public/}
media.cache-dir=${MEDIA_CACHE_DIR:media-cache}
